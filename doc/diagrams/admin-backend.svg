<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 300" width="100%" style="display:block" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" marker-width="8" marker-height="6" ref-x="7" ref-y="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#57606a"/></marker><marker id="ahd" marker-width="8" marker-height="6" ref-x="7" ref-y="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#e5484d"/></marker><marker id="ahc" marker-width="8" marker-height="6" ref-x="7" ref-y="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0d9488"/></marker><marker id="ahm" marker-width="8" marker-height="6" ref-x="7" ref-y="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#8250df"/></marker></defs><rect x="30" y="20" width="140" height="50" rx="5" fill="#ffebe9" stroke="#e5484d" stroke-width="1.2"/><text x="100" y="40" text-anchor="middle" fill="#e5484d" font-size="9" font-weight="700">Admin Frontend</text><text x="100" y="54" text-anchor="middle" fill="#8c959f" font-size="8">React · JWT 认证</text><text x="100" y="64" text-anchor="middle" fill="#8c959f" font-size="8">工作流 CRUD / 函数管理 / 执行日志</text><rect x="220" y="20" width="190" height="50" rx="5" fill="#ffebe9" stroke="#e5484d" stroke-width="1.2"/><text x="315" y="40" text-anchor="middle" fill="#e5484d" font-size="9" font-weight="700">Admin API (fluxion-admin)</text><text x="315" y="54" text-anchor="middle" fill="#8c959f" font-size="8">Spring Boot · RBAC 权限</text><text x="315" y="64" text-anchor="middle" fill="#8c959f" font-size="8">POST /workflows  GET /executions  POST /debug/step</text><line x1="170" y1="45" x2="220" y2="45" stroke="#e5484d" stroke-width="1.5" marker-end="url(#ah)"/><text x="196" y="39" fill="#e5484d" font-size="8" text-anchor="middle">REST</text><rect x="460" y="12" width="210" height="66" rx="5" fill="#eaeef2" stroke="#8250df" stroke-width="1.2" stroke-dasharray="5,3"/><text x="565" y="28" text-anchor="middle" fill="#8250df" font-size="9" font-weight="700">Admin API = META WorkflowDef 自举</text><text x="565" y="42" text-anchor="middle" fill="#8c959f" font-size="8">每个 Admin API 端点对应一条 category=META</text><text x="565" y="54" text-anchor="middle" fill="#8c959f" font-size="8">is_protected=1 的 WorkflowDefinition</text><text x="565" y="66" text-anchor="middle" fill="#8c959f" font-size="8">MetaWorkflowGuard 保护：禁止删除 / 修改路由</text><line x1="410" y1="45" x2="460" y2="45" stroke="#8250df" stroke-width="1.5" marker-end="url(#ahm)"/><rect x="30" y="110" width="210" height="80" rx="5" fill="#ffebe9" stroke="#e5484d" stroke-width="1.2"/><text x="135" y="126" text-anchor="middle" fill="#e5484d" font-size="9" font-weight="700">MetaWorkflowLoader</text><text x="135" y="140" text-anchor="middle" fill="#8c959f" font-size="8">三级降级启动 (Bootstrap Fallback)</text><text x="48" y="158" fill="#8c959f" font-size="8">Level 1: DB 加载所有 META WorkflowDef</text><text x="48" y="170" fill="#8c959f" font-size="8">Level 2: classpath:/meta-workflows/*.yaml</text><text x="48" y="182" fill="#8c959f" font-size="8">Level 3: 硬编码最小 REST 接口（紧急兜底）</text><line x1="135" y1="70" x2="135" y2="110" stroke="#e5484d" stroke-width="1.5" marker-end="url(#ah)"/><rect x="290" y="110" width="200" height="56" rx="5" fill="#dafbe1" stroke="#0d9488" stroke-width="1.2"/><text x="390" y="128" text-anchor="middle" fill="#0d9488" font-size="9" font-weight="700">WorkflowDefinitionCache</text><text x="390" y="142" text-anchor="middle" fill="#8c959f" font-size="8">Caffeine 本地缓存 (L1)</text><text x="390" y="154" text-anchor="middle" fill="#8c959f" font-size="8">cache.put() ← ConfigSyncManager 更新</text><text x="390" y="163" text-anchor="middle" fill="#8c959f" font-size="8">WorkflowRouter.execute() 读取（热加载透明）</text><line x1="240" y1="145" x2="290" y2="145" stroke="#0d9488" stroke-width="1.5" marker-end="url(#ahc)"/><rect x="550" y="110" width="200" height="56" rx="5" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/><text x="650" y="128" text-anchor="middle" fill="#d4a72c" font-size="9" font-weight="700">ConfigSyncManager</text><text x="650" y="142" text-anchor="middle" fill="#8c959f" font-size="8">L1 DB 轮询 (30s / poll-interval)</text><text x="650" y="154" text-anchor="middle" fill="#8c959f" font-size="8">L2 Apollo 推送 (毫秒级延迟)</text><text x="650" y="163" text-anchor="middle" fill="#8c959f" font-size="8">L3 Nacos 推送 (服务发现一体)</text><line x1="490" y1="138" x2="550" y2="138" stroke="#d4a72c" stroke-width="1.5" marker-end="url(#ah)"/><text x="521" y="132" fill="#d4a72c" font-size="8" text-anchor="middle">更新</text><rect x="290" y="220" width="200" height="40" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="390" y="237" text-anchor="middle" fill="#57606a" font-size="9" font-weight="600">wf_definition (MySQL)</text><text x="390" y="252" text-anchor="middle" fill="#8c959f" font-size="8">updated_at 变更 → L1 轮询感知</text><rect x="550" y="220" width="200" height="40" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="650" y="237" text-anchor="middle" fill="#57606a" font-size="9" font-weight="600">Apollo / Nacos</text><text x="650" y="252" text-anchor="middle" fill="#8c959f" font-size="8">配置推送 → L2/L3 监听器回调</text><line x1="390" y1="166" x2="390" y2="220" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/><line x1="650" y1="166" x2="650" y2="220" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/><text x="450" y="292" text-anchor="middle" fill="#8c959f" font-size="8">管理后台本身通过元工作流自举，ConfigSyncManager 驱动全平台热加载，WorkflowDefinitionCache 屏蔽变更细节</text></svg>
