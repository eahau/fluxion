    # ============ FunctionSets（函数集合发布/复用） ============
    PublishFunctionSetRequest:
      type: object
      properties:
        setRefName:
          type: string
          maxLength: 128
          description: |
            可选自定义函数别名。为空时按 {appGroup}.set.{workflowId} 自动生成。
            该别名会写入 wf_function.function_alias，供 SET_REF 解析时使用。

    CanComposeAfterRequest:
      type: object
      required: [setARefName, setBRefName]
      properties:
        setARefName:
          type: string
          description: 前一个集合的 SET_REF 别名（对应 wf_function.function_alias）
        setBRefName:
          type: string
          description: 后一个集合的 SET_REF 别名
        inputMapping:
          type: string
          description: |
            可选字段映射 JSON 字符串，数组形式：
            [
              {"type":"path","from":"$.user.id","to":"userId"},
              {"type":"literal","value":10000,"to":"timeoutMs"}
            ]

    FunctionSetDTO:
      type: object
      required: [id, workflowId, workflowName, published, status, scope, category]
      properties:
        id:
          type: integer
          format: int64
        workflowId:
          type: string
        workflowName:
          type: string
        published:
          type: boolean
          description: is_published_set 是否生效
        setRefName:
          type: string
          nullable: true
          description: wf_function.function_alias，SET_REF 解析时用
        status:
          type: string
          enum: [DRAFT, ACTIVE, DEPRECATED, ARCHIVED]
        protocol:
          type: string
          nullable: true
          description: 触发协议（HTTP/KAFKA/DUBBO/GRPC/null），null 表示无触发入口的纯封装集合
        scope:
          type: string
          enum: [PUBLIC, PRIVATE]
        appGroup:
          type: string
          nullable: true
        inputSchemaPresent:
          type: boolean
          description: 入参 schema 是否已填（发布集合的前置条件之一）
        outputSchemaPresent:
          type: boolean
          description: 出参 schema 是否已填（发布集合的前置条件之一）
        version:
          type: integer
          format: int32
        category:
          type: string
          enum: [ETL, SERVICE, INTEGRATION, TEST, OTHER]
        owner:
          type: string
          nullable: true
          description: 所有者登录名

    # ============ SchemaTools（兼容校验 + 字段映射） ============
    SchemaCompatCheckRequest:
      type: object
      properties:
        sourceSchema:
          type: string
          description: |
            源端 JSON-Schema 字符串（如节点 A 输出 schema，或测试输入 schema），为空时按自由对象处理
        targetSchema:
          type: string
          description: |
            目标端 JSON-Schema 字符串（如节点 B 输入 schema，或 DAG 输入 schema），为空时校验必失败
        mappingJson:
          type: string
          nullable: true
          description: |
            可选字段映射 JSON 字符串，数组形式。非空时先对 source 跑映射再做子集校验。
            规则：
            - {type:"path", from:"JSONPath表达式", to:"目标字段名"}
            - {type:"literal", value:字面量, to:"目标字段名"}

    SchemaApplyMappingRequest:
      type: object
      required: [sourcePayloadJson]
      properties:
        sourcePayloadJson:
          type: string
          description: 真实的源端 JSON 对象字符串（即设计器 preview 里用户填的 payload）
        mappingJson:
          type: string
          nullable: true
          description: 同 SchemaCompatCheckRequest.mappingJson

    CompatDiagnostic:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: JSONPath 风格的字段定位，如 "properties.user.properties.id"
        message:
          type: string
          description: 对人友好的诊断文案，可直接在设计器标红
        expectedType:
          type: string
          nullable: true
        actualType:
          type: string
          nullable: true

    CompatResult:
      type: object
      required: [compatible]
      properties:
        compatible:
          type: boolean
          description: true = target 所有 required 字段在 source/mapping 中存在且类型兼容
        sourceFields:
          type: integer
          format: int32
          description: 映射后的 source schema 顶层字段数
        targetRequiredCount:
          type: integer
          format: int32
        missingRequired:
          type: array
          items:
            $ref: '#/components/schemas/CompatDiagnostic'
          description: 目标 required 字段在 source 缺失，必须补映射才能接线
        typeMismatches:
          type: array
          items:
            $ref: '#/components/schemas/CompatDiagnostic'
          description: 字段名对得上但类型不匹配（需要类型转换/数据清洗）
        unmappedOptional:
          type: array
          items:
            $ref: '#/components/schemas/CompatDiagnostic'
          description: 目标 optional 字段缺失，非硬性阻塞，用于提示用户

    CompositionResult:
      allOf:
        - $ref: '#/components/schemas/CompatResult'
        - type: object
          properties:
            setAWorkflowId:
              type: string
              nullable: true
            setBWorkflowId:
              type: string
              nullable: true
            setAWorkflowName:
              type: string
              nullable: true
            setBWorkflowName:
              type: string
              nullable: true
            mappingApplied:
              type: boolean
              description: 是否存在 inputMapping 且成功应用
            errors:
              type: array
              items:
                type: string
              description: A/B 本身未发布等业务级错误（不同于 schema 级诊断）

    # ============ Apps ============
    App:
      type: object
      required: [id, appKey, appName, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        appKey:
          type: string
          description: 稳定业务标识（如 order-app / pay-app），函数集合的 appGroup 会对齐到这个 key
        appName:
          type: string
        description:
          type: string
          nullable: true
        owner:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        createdAt:
          type: integer
          format: int64
          description: Unix 毫秒
        updatedAt:
          type: integer
          format: int64

    AppCreateRequest:
      type: object
      required: [appKey, appName]
      properties:
        appKey:
          type: string
          minLength: 1
          maxLength: 64
        appName:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 512
        owner:
          type: string
          maxLength: 64
        status:
          type: string
          enum: [ACTIVE, DISABLED]
          default: ACTIVE

    AppUpdateRequest:
      type: object
      properties:
        appName:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 512
        owner:
          type: string
          maxLength: 64
        status:
          type: string
          enum: [ACTIVE, DISABLED]

    AppBinding:
      type: object
      required: [id, appId, resourceId, resourceName, resourceType, scope, effectiveAlias]
      properties:
        id:
          type: integer
          format: int64
        appId:
          type: integer
          format: int64
        resourceId:
          type: integer
          format: int64
        resourceName:
          type: string
        resourceType:
          type: string
          description: 资源类型（MYSQL/POSTGRESQL/REDIS/HTTP_ENDPOINT…）
        driver:
          type: string
          nullable: true
          description: 驱动类名（DB 类资源）
        scope:
          type: string
          enum: [READONLY, READWRITE, ADMIN]
          description: 应用对该资源的访问级别
        aliasInApp:
          type: string
          nullable: true
          description: >-
            用户自定义别名；为空时 effectiveAlias 默认取资源名 resourceName
        effectiveAlias:
          type: string
          description: 最终别名，设计器下拉选项实际用这个 value

    AppBindingCreateRequest:
      type: object
      required: [resourceId]
      properties:
        resourceId:
          type: integer
          format: int64
        aliasInApp:
          type: string
          maxLength: 128
        scope:
          type: string
          enum: [READONLY, READWRITE, ADMIN]
          default: READWRITE

    AppBindingUpdateRequest:
      type: object
      properties:
        aliasInApp:
          type: string
          maxLength: 128
          nullable: true
        scope:
          type: string
          enum: [READONLY, READWRITE, ADMIN]

    # ============ Resources ============
    ResourceType:
      type: string
      enum: [MYSQL, POSTGRESQL, ORACLE, SQLSERVER, H2, CLICKHOUSE, REDIS, HTTP_ENDPOINT, RABBITMQ, KAFKA, OTHER]

    Resource:
      type: object
      required: [id, resourceName, resourceType, configJson, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        resourceName:
          type: string
        driver:
          type: string
          nullable: true
          description: JDBC driver class 等可选驱动标识
        configJson:
          type: object
          additionalProperties: true
          description: |
            资源配置（返回内容为脱敏副本：password/secret/token 等 key 被替换为 "<REDACTED>"；
            更新时发送 "<REDACTED>" 表示保留原值，无需重填明文）。
            典型 schema 示例：
            - MYSQL: { host, port, database, username, password, useSSL:bool, driverClassname? }
            - REDIS: { host, port, dbIndex, password?, timeoutMs?, sentinel? }
            - HTTP_ENDPOINT: { baseUrl, defaultHeaders?:{k:v}, timeoutMs?, auth? }
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64

    ResourceCreateRequest:
      type: object
      required: [resourceName, resourceType, configJson]
      properties:
        resourceName:
          type: string
          minLength: 1
          maxLength: 128
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        driver:
          type: string
          maxLength: 256
        configJson:
          type: object
          additionalProperties: true
          description: 明文配置（包含 password/secret/token 等）

    ResourceUpdateRequest:
      type: object
      properties:
        resourceName:
          type: string
          minLength: 1
          maxLength: 128
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        driver:
          type: string
          maxLength: 256
          nullable: true
        configJson:
          type: object
          additionalProperties: true
          description: 若某敏感 key 的值为字符串 "<REDACTED>" 表示保留原值

    ResourceOption:
      type: object
      required: [resourceId, alias, label, resourceType, driver]
      properties:
        resourceId:
          type: integer
          format: int64
        alias:
          type: string
          description: effectiveAlias（函数参数 value = 此值）
        label:
          type: string
          description: >-
            用户可读形式：alias — resourceName
        resourceType:
          type: string
        driver:
          type: string
          nullable: true

    # ============ Sandboxes ============
    SandboxStatus:
      type: string
      enum: [CREATING, READY, EXPIRED, RELEASING, FAILED]

    SandboxInstance:
      type: object
      required: [id, resourceId, tablePrefix, clonedTables, status, expiresAt, createdAt]
      properties:
        id:
          type: integer
          format: int64
        resourceId:
          type: integer
          format: int64
          description: 克隆源 Resource（DB）的 id
        tablePrefix:
          type: string
          description: 实际加到表名前的前缀，如 "sb_a1b2c3d4_"
        clonedTables:
          type: integer
          format: int32
          description: 已克隆（CREATE TABLE LIKE + INSERT）的表数量
        status:
          $ref: '#/components/schemas/SandboxStatus'
        expiresAt:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64

    SandboxTicket:
      type: object
      required: [sessionId, appId, instances, totalClonedTables, expiresAt, createdAt]
      properties:
        sessionId:
          type: string
        appId:
          type: integer
          format: int64
        ownerUsername:
          type: string
          nullable: true
        instances:
          type: array
          items:
            $ref: '#/components/schemas/SandboxInstance'
        totalClonedTables:
          type: integer
          format: int32
        expiresAt:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        routingContext:
          type: object
          additionalProperties: true
          description: |
            设计器必须把此 object 合并到每次 /internal/debug/execute 请求的 body 里，
            让 builtin:dbExecute 透明路由到 sb_* 前缀的克隆表。

    SandboxAcquireRequest:
      type: object
      required: [appId, sessionId]
      properties:
        appId:
          type: integer
          format: int64
        sessionId:
          type: string
          minLength: 1
        username:
          type: string
          maxLength: 64
        resourceIds:
          type: array
          description: 要克隆的 DB Resource id 列表；为空时取该应用下所有 scope=READWRITE 的 DB 资源
          items:
            type: integer
            format: int64
        ttlMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 1440
          default: 240
          description: 沙盒存活时间，超时后自动 DROP 克隆表

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
