openapi: 3.0.3
info:
  title: Workflow Admin API
  description: 工作流平台管理后台 REST API
  version: 1.0.0
  contact:
    name: Workflow Platform Team

servers:
  - url: http://localhost:8080
    description: 本地开发环境
  - url: https://api.example.com
    description: 生产环境

tags:
  - name: Auth
    description: OAuth 2.0 / OIDC 认证授权
  - name: Workflows
    description: 工作流定义管理
  - name: Debug
    description: 调试执行
  - name: Schemas
    description: Schema 注册与管理
  - name: Functions
    description: 函数注册与管理
  - name: Decorators
    description: 节点装饰器参数 Schema
  - name: Instances
    description: 业务实例注册与发现
  - name: Executions
    description: 执行历史与重放
  - name: Monitor
    description: 监控与日志
  - name: Audit
    description: 审计日志
  - name: User
    description: 用户管理
  - name: Role
    description: 角色管理
  - name: Datasources
    description: 数据源元数据查询（表/列浏览）
  - name: FunctionSets
    description: 函数集合发布/复用（原工作流提升为可组合函数节点，SET_REF 类型）
  - name: SchemaTools
    description: Schema 兼容性校验与字段映射预览（子集规则 + JSONPath/字面量映射）
  - name: TriggerFunctions
    description: 入站触发函数元数据（HTTP/Kafka/Dubbo/gRPC 的 paramSchema，前端按此动态渲染表单）
  - name: Apps
    description: 应用中心 — 应用（App）CRUD + 资源绑定
  - name: Resources
    description: 资源中心 — 全局可复用的数据源（DB/Redis/HTTP…）注册表，敏感字段自动脱敏
  - name: Sandboxes
    description: 调试沙盒管理 — 表前缀隔离的临时 DB 实例（sb_<hash>_*）

paths:
  # ============ Auth API ============
  /api/admin/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: 用户登录
      description: |
        管理员登录，返回 JWT Token。
        底层认证由 AuthProvider SPI 驱动：
        - local：本地数据库（默认）
        - remote：远程 OAuth 2.0 / OIDC 服务（Keycloak、Casdoor 等）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============ Workflow API ============
  /api/admin/workflows:
    get:
      operationId: listWorkflows
      tags: [Workflows]
      summary: 分页查询工作流定义
      parameters:
        - name: keyword
          in: query
          description: 关键词（名称/描述）
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/WorkflowStatus'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/WorkflowCategory'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseWorkflowDefinition'

    post:
      operationId: createWorkflow
      tags: [Workflows]
      summary: 创建工作流
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowDefinition'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinition'

  /api/admin/workflows/{workflowId}:
    get:
      operationId: getWorkflow
      tags: [Workflows]
      summary: 获取工作流详情
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinition'
        '404':
          description: 未找到
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      operationId: updateWorkflow
      tags: [Workflows]
      summary: 更新工作流
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowDefinition'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinition'
        '404':
          description: 未找到
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      operationId: deleteWorkflow
      tags: [Workflows]
      summary: 删除工作流
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '204':
          description: 删除成功
        '404':
          description: 未找到
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/workflows/{workflowId}/execute:
    post:
      operationId: executeWorkflow
      tags: [Workflows]
      summary: 执行工作流
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
                  additionalProperties: true
                  description: 工作流各节点输入参数（key=nodeId）
      responses:
        '200':
          description: 执行成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugResult'

  /api/admin/workflows/{workflowId}/publish:
    post:
      operationId: publishWorkflow
      tags: [Workflows]
      summary: 发布工作流
      description: 将工作流从 DRAFT 状态发布为 ACTIVE，并按指定的 PublishTarget 推送到配置中心
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishTarget'
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinition'
        '404':
          description: 未找到
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/workflows/{workflowId}/deprecate:
    post:
      operationId: deprecateWorkflow
      tags: [Workflows]
      summary: 下线工作流
      description: 将工作流从 ACTIVE 状态变更为 DEPRECATED，并从配置中心移除
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '200':
          description: 下线成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinition'
        '404':
          description: 未找到
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/workflows/{workflowId}/versions:
    get:
      operationId: listWorkflowVersions
      tags: [Workflows]
      summary: 查询工作流历史版本
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowDefinition'

  /api/admin/workflows/{workflowId}/rollback:
    post:
      operationId: rollbackWorkflow
      tags: [Workflows]
      summary: 回滚工作流到指定版本
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
      responses:
        '200':
          description: 回滚成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinition'

  /api/admin/workflows/import/openapi:
    post:
      operationId: importOpenAPI
      tags: [Workflows]
      summary: 导入 OpenAPI 文件
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 导入结果
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowDefinition'

  /api/admin/workflows/import/openapi/confirm:
    post:
      operationId: confirmImportOpenAPI
      tags: [Workflows]
      summary: 确认导入 OpenAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportConfirmRequest'
      responses:
        '200':
          description: 确认导入结果
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowDefinition'

  /api/admin/workflows/export/openapi:
    get:
      operationId: exportOpenAPI
      tags: [Workflows]
      summary: 导出 OpenAPI（单工作流/全量）
      parameters:
        - name: ids
          in: query
          schema:
            type: array
            items:
              type: string
          description: 工作流 ID 列表（不传则导出全量）
        - name: title
          in: query
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OpenAPI 文档
          content:
            application/json:
              schema:
                type: object
            text/yaml:
              schema:
                type: string
    post:
      operationId: batchExportOpenAPI
      tags: [Workflows]
      summary: 批量导出 OpenAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAPIExportRequest'
      responses:
        '200':
          description: OpenAPI 文档
          content:
            application/json:
              schema:
                type: object
            text/yaml:
              schema:
                type: string

  # ============ Debug API ============
  /api/admin/workflows/{workflowId}/debug:
    post:
      operationId: debugWorkflow
      tags: [Debug]
      summary: 调试执行工作流
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebugWorkflowRequest'
      responses:
        '200':
          description: 调试结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugResult'

  /api/admin/workflows/{workflowId}/debug/node:
    post:
      operationId: debugWorkflowNode
      tags: [Debug]
      summary: 调试单个节点
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebugNodeRequest'
      responses:
        '200':
          description: 调试结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugResult'

  /api/admin/workflows/{workflowId}/debug/step:
    post:
      operationId: debugWorkflowStep
      tags: [Debug]
      summary: 单步执行
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebugStepRequest'
      responses:
        '200':
          description: 调试结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugResult'

  /api/admin/workflows/{workflowId}/debug/rerun:
    post:
      operationId: rerunWorkflowNode
      tags: [Debug]
      summary: 从节点重跑
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebugRerunRequest'
      responses:
        '200':
          description: 重跑结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugResult'

  /api/admin/workflows/{workflowId}/debug/history:
    get:
      operationId: listDebugHistory
      tags: [Debug]
      summary: 查询调试执行历史
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 调试历史列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseDebugExecutionRecord'

  /api/admin/workflows/{workflowId}/debug/history/{executionId}:
    get:
      operationId: getDebugHistoryDetail
      tags: [Debug]
      summary: 查询调试历史详情
      parameters:
        - $ref: '#/components/parameters/WorkflowIdPath'
        - name: executionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 调试历史详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugExecutionRecord'

  # ============ Schema API ============
  /api/admin/schemas:
    get:
      operationId: listSchemas
      tags: [Schemas]
      summary: 分页查询 Schema
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: schemaType
          in: query
          schema:
            type: string
          description: 按类型标签过滤（INPUT/OUTPUT/EVENT），仅返回包含该标签的 Schema
        - name: domain
          in: query
          schema:
            type: string
          description: 按领域分类过滤（db/redis/cache/http/mq/script/common/other），传 all 或空表示不限
        - name: frozen
          in: query
          schema:
            type: boolean
          description: 按冻结状态过滤（true=仅已冻结、false=仅未冻结，不传=不限）
        - name: appGroup
          in: query
          schema:
            type: string
          description: 按所属应用 AppKey 过滤（过滤 scope=PRIVATE 且 appGroup 精确匹配的；PLATFORM 不受此限制）
        - name: sortField
          in: query
          schema:
            type: string
            enum: [createdAt, updatedAt]
            default: updatedAt
          description: 排序字段：createdAt=按创建时间；updatedAt=按更新时间（默认）
        - name: sortDirection
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: 排序方向：asc=升序；desc=降序（默认）
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseSchemaDefinition'

    post:
      operationId: createSchema
      tags: [Schemas]
      summary: 注册 Schema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaDefinition'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDefinition'

  /api/admin/schemas/{schemaName}:
    get:
      operationId: getSchema
      tags: [Schemas]
      summary: 获取 Schema 详情
      parameters:
        - $ref: '#/components/parameters/SchemaNamePath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDefinition'
        '404':
          description: 未找到
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      operationId: updateSchema
      tags: [Schemas]
      summary: 更新 Schema
      parameters:
        - $ref: '#/components/parameters/SchemaNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaDefinition'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDefinition'

    delete:
      operationId: deleteSchema
      tags: [Schemas]
      summary: 删除 Schema
      parameters:
        - $ref: '#/components/parameters/SchemaNamePath'
      responses:
        '204':
          description: 删除成功

  /api/admin/schemas/tables:
    get:
      operationId: listTables
      tags: [Schemas]
      summary: 列出数据库中所有用户表
      parameters:
        - name: dataSource
          in: query
          schema:
            type: string
          description: 数据源名称，默认使用主数据源
      responses:
        '200':
          description: 表名列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/admin/schemas/tables/{tableName}/columns:
    get:
      operationId: listTableColumns
      tags: [Schemas]
      summary: 获取指定表的列元数据
      parameters:
        - $ref: '#/components/parameters/TableNamePath'
        - name: dataSource
          in: query
          schema:
            type: string
          description: 数据源名称，默认使用主数据源
      responses:
        '200':
          description: 列元数据列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableColumnMetadata'

  /api/admin/schemas/tables/detail:
    get:
      operationId: listTablesWithColumns
      tags: [Schemas]
      summary: 获取所有表及其列信息，用于设计器侧边栏一次性加载
      parameters:
        - name: dataSource
          in: query
          schema:
            type: string
          description: 数据源名称，默认使用主数据源
      responses:
        '200':
          description: 表及其列列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableDetail'

  /api/admin/schemas/tables/{tableName}/foreign-keys:
    get:
      operationId: listForeignKeys
      tags: [Schemas]
      summary: 获取指定表的外键信息
      parameters:
        - $ref: '#/components/parameters/TableNamePath'
        - name: dataSource
          in: query
          schema:
            type: string
          description: 数据源名称，默认使用主数据源
      responses:
        '200':
          description: 外键信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForeignKeysResponse'

  /api/admin/schemas/tables/{tableName}/json-schema:
    get:
      operationId: generateTableJsonSchema
      tags: [Schemas]
      summary: 根据表结构生成 JSON Schema，不持久化
      parameters:
        - $ref: '#/components/parameters/TableNamePath'
        - name: dataSource
          in: query
          schema:
            type: string
          description: 数据源名称，默认使用主数据源
      responses:
        '200':
          description: 生成的 JSON Schema 字符串
          content:
            application/json:
              schema:
                type: string

  /api/admin/schemas/{schemaName}/versions:
    get:
      operationId: listSchemaVersions
      tags: [Schemas]
      summary: 查询 Schema 历史版本
      parameters:
        - $ref: '#/components/parameters/SchemaNamePath'
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchemaDefinition'

  # ============ Function API ============
  /api/admin/functions:
    get:
      operationId: listFunctions
      tags: [Functions]
      summary: 分页查询函数
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/FunctionCategory'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseFunctionDefinition'

    post:
      operationId: createFunction
      tags: [Functions]
      summary: 注册函数
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionDefinition'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionDefinition'

  /api/admin/functions/{functionName}:
    get:
      operationId: getFunction
      tags: [Functions]
      summary: 获取函数详情
      parameters:
        - $ref: '#/components/parameters/FunctionNamePath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionDefinition'
        '404':
          description: 未找到
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      operationId: updateFunction
      tags: [Functions]
      summary: 更新函数
      parameters:
        - $ref: '#/components/parameters/FunctionNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionDefinition'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionDefinition'

    delete:
      operationId: deleteFunction
      tags: [Functions]
      summary: 删除函数
      parameters:
        - $ref: '#/components/parameters/FunctionNamePath'
      responses:
        '204':
          description: 删除成功

  /api/admin/functions/{functionName}/test:
    post:
      operationId: testFunction
      tags: [Functions]
      summary: 测试执行函数
      parameters:
        - $ref: '#/components/parameters/FunctionNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
                  additionalProperties: true
                  description: 函数节点参数（nodeParams），即函数 paramSchema 对应的实例数据
                directInput:
                  type: object
                  additionalProperties: true
                  description: 直接入参（模拟上游节点输出 / DAG 聚合结果），未传时默认使用 inputs
                workflowInput:
                  type: object
                  additionalProperties: true
                  description: 工作流原始入参（模拟 workflowInput）
                declaredDeps:
                  type: object
                  additionalProperties: true
                  description: 声明依赖节点输出（key 为节点 ID，value 为节点输出）
      responses:
        '200':
          description: 测试成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  output:
                    description: 函数执行输出（任意类型，如对象、数组、字符串、数字等）
                  error:
                    type: string
                  errorType:
                    type: string
                    description: 异常类型（异常类简单名）
                  errorStack:
                    type: string
                    description: 异常堆栈摘要（admin 调试用）
                  durationMs:
                    type: integer
                    format: int64
                    description: 函数执行耗时（毫秒）
                  logs:
                    type: array
                    items:
                      type: string
                    description: 函数测试执行日志（输入、输出、异常等）
                  outputValid:
                    type: boolean
                    description: 输出是否符合出参 schema（无出参 schema 时默认为 true）
                  validationErrors:
                    type: array
                    items:
                      type: string
                    description: 出参 schema 校验错误列表

