  # ============ FunctionSets API（函数集合发布/复用） ============
  /api/admin/function-sets:
    get:
      operationId: listFunctionSets
      tags: [FunctionSets]
      summary: 列出已发布的函数集合
      description: |
        给前端 Designer 的函数下拉框用，返回所有 isPublishedSet=true 的工作流定义。
        可选按 appId（应用）和 scope（PUBLIC/PRIVATE）过滤。
      parameters:
        - name: appId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: scope
          in: query
          required: false
          description: PUBLIC=全局可见，PRIVATE=仅同 appGroup 可见
          schema:
            type: string
            enum: [PUBLIC, PRIVATE]
      responses:
        '200':
          description: 函数集合列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FunctionSetDTO'

  /api/admin/function-sets/{definitionId}/publish:
    post:
      operationId: publishFunctionSet
      tags: [FunctionSets]
      summary: 将工作流定义发布为可复用函数集合（SET_REF 函数）
      description: |
        前置条件：wf_definition.status=ACTIVE 且 inputSchema / outputSchema 都非空。
        发布后会在 wf_function 表 upsert 一条 function_type=SET_REF 的记录，前端拖拽函数下拉时可见。
      parameters:
        - name: definitionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishFunctionSetRequest'
      responses:
        '201':
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionSetDTO'
        '400':
          description: 不满足发布条件（非 ACTIVE / 缺少入出参 schema）或 setRefName 冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/function-sets/{definitionId}/unpublish:
    post:
      operationId: unpublishFunctionSet
      tags: [FunctionSets]
      summary: 撤销函数集合发布（删除 SET_REF 函数）
      parameters:
        - name: definitionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 撤销成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionSetDTO'
        '404':
          description: 定义不存在

  /api/admin/function-sets/can-compose-after:
    post:
      operationId: canComposeAfterFunctionSet
      tags: [FunctionSets]
      summary: 预检两个集合 A→B 是否可通过兼容子集 + 字段映射组合
      description: |
        供前端 Designer 接线 widget 用：集合 B 的输入 schema 必须是集合 A 输出 schema 的目标子集，
        可附带 inputMapping JSON 做 JSONPath/字面量字段映射后再校验。
        返回结果和 /api/schema-tools/compatibility-check 结构相同，可复用同一诊断组件。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanComposeAfterRequest'
      responses:
        '200':
          description: 兼容校验结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionResult'

  # ============ SchemaTools API（兼容校验 + 映射预览） ============
  /api/admin/schema-tools/compatibility-check:
    post:
      operationId: checkSchemaCompatibility
      tags: [SchemaTools]
      summary: 通用 schema 兼容校验（目标子集规则 + 可选字段映射层）
      description: |
        跨场景使用：
        1) 节点 A→B 接线校验（DAG edge 保存前）
        2) 测试 payload → DAG 输入 schema 校验
        3) Trigger 事件入站 payload → 头节点 schema 校验
        先对 sourceSchema 做 mapping（若有），再对 targetSchema 做 required 子集 + 类型匹配，
        返回三级诊断：missingRequired / typeMismatches / unmappedOptional。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaCompatCheckRequest'
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatResult'

  /api/admin/schema-tools/apply-mapping:
    post:
      operationId: applySchemaMapping
      tags: [SchemaTools]
      summary: 预览字段映射效果（把真实 sourcePayload + mapping JSON 跑一遍，返回映射后的对象）
      description: 设计器接线 preview 用，方便用户看映射后的 JSON 形状。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaApplyMappingRequest'
      responses:
        '200':
          description: 映射后的 JSON 对象（自由结构，不预先定义 schema）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

