      responses:
        '200':
          description: 绑定关系列表（已 left join 资源名/类型/驱动）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppBinding'
    post:
      operationId: createAppBinding
      tags: [Apps]
      summary: 为应用绑定一个全局资源
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppBindingCreateRequest'
      responses:
        '201':
          description: 绑定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppBinding'
        '400':
          description: 参数错误（aliasInApp 重复、资源不存在、scope 不匹配等）

  /api/admin/apps/{id}/bindings/{bindingId}:
    parameters:
      - $ref: '#/components/parameters/AppIdPath'
      - $ref: '#/components/parameters/BindingId'
    put:
      operationId: updateAppBinding
      tags: [Apps]
      summary: 更新绑定（aliasInApp / resourceScope）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppBindingUpdateRequest'
      responses:
        '200':
          description: 更新后绑定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppBinding'
        '404':
          description: 应用或绑定不存在
    delete:
      operationId: deleteAppBinding
      tags: [Apps]
      summary: 解除绑定
      responses:
        '204':
          description: 解绑成功
        '404':
          description: 应用或绑定不存在

  /api/admin/apps/{id}/resource-options:
    parameters:
      - $ref: '#/components/parameters/AppIdPath'
    get:
      operationId: listAppResourceOptions
      tags: [Apps]
      summary: 下拉可绑定资源（设计器中 dbExecute/redisCommand 的 resource 参数用）
      parameters:
        - name: resourceType
          in: query
          required: true
          schema:
            type: string
          description: 资源类型过滤，如 MYSQL / REDIS / HTTP_ENDPOINT
      responses:
        '200':
          description: 已绑定该类型资源的下拉选项（携带 alias）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceOption'

  # ============ Resources API（资源中心） ============
  /api/admin/resources:
    get:
      operationId: listResources
      tags: [Resources]
      summary: 列出所有全局资源
      description: 返回的 `config` 是脱敏副本，password/secret/token 等 key 会被替换为 `<REDACTED>`。
      parameters:
        - name: resourceType
          in: query
          required: false
          schema:
            type: string
          description: 按资源类型过滤（MYSQL/POSTGRESQL/REDIS/HTTP_ENDPOINT…）
      responses:
        '200':
          description: 资源列表（config 脱敏）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
    post:
      operationId: createResource
      tags: [Resources]
      summary: 创建资源（config 含明文密码，服务端加密存储）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCreateRequest'
      responses:
        '201':
          description: 创建成功（返回脱敏 config）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          description: 参数错误

  /api/admin/resources/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getResource
      tags: [Resources]
      summary: 查询单个资源（config 脱敏）
      responses:
        '200':
          description: 资源实体
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '404':
          description: 资源不存在
    put:
      operationId: updateResource
      tags: [Resources]
      summary: 更新资源
      description: 若 config 中对应 key 的值是字符串 `<REDACTED>`，表示未修改，服务端会保留原值。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceUpdateRequest'
      responses:
        '200':
          description: 更新后实体（config 脱敏）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '404':
          description: 资源不存在
    delete:
      operationId: deleteResource
      tags: [Resources]
      summary: 删除资源
      description: 若仍有应用 binding 引用该资源，返回 409 Conflict。
      responses:
        '204':
          description: 删除成功
        '409':
          description: 存在引用，禁止删除
        '404':
          description: 资源不存在

  # ============ Sandboxes API（调试沙盒管理） ============
  /api/admin/internal/debug/sandbox/acquire:
    post:
      operationId: acquireSandbox
      tags: [Sandboxes]
      summary: 申请一个调试沙盒会话（对指定 DB 资源做 sb_ 前缀克隆表）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxAcquireRequest'
      responses:
        '200':
          description: 沙盒票据（含 routingContext，设计器要在 run 请求中带上）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxTicket'
        '400':
          description: 参数错误

  /api/admin/internal/debug/sandbox/session/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: releaseSandboxSession
      tags: [Sandboxes]
      summary: 释放整个调试会话的所有沙盒（DROP 克隆表）
      responses:
        '204':
          description: 已释放

  /api/admin/internal/debug/sandbox/{id}:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    get:
      operationId: peekSandbox
      tags: [Sandboxes]
      summary: 沙盒详情（预留，当前返回 501）
      responses:
        '501':
          description: Not Implemented
    delete:
      operationId: releaseSandbox
      tags: [Sandboxes]
      summary: 强制释放单个沙盒实例
      responses:
        '204':
          description: 释放成功
        '404':
          description: 沙盒不存在

components:
  parameters:
    AppIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    BindingId:
      name: bindingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SandboxId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      description: 页码（从 0 开始）
      schema:
        type: integer
        default: 0

    PageSize:
      name: pageSize
      in: query
      description: 每页条数
      schema:
        type: integer
        default: 20

    AppId:
      name: appId
      in: query
      schema:
        type: integer
        format: int64
      description: 按所属应用 ID 精确过滤（scope=PRIVATE 且同 app 匹配；PLATFORM/MARKETPLACE 不受此限制）

    SortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum: [name, createdAt, updatedAt, category]
        default: updatedAt
      description: 排序字段

    SortDir:
      name: sortDir
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      description: 排序方向

    InstanceIdPath:
      name: instanceId
      in: path
      required: true
      description: 业务实例唯一标识
      schema:
        type: string

    WorkflowIdPath:
      name: workflowId
      in: path
      required: true
      schema:
        type: string

    SchemaNamePath:
      name: schemaName
      in: path
      required: true
      schema:
        type: string

    TableNamePath:
      name: tableName
      in: path
      required: true
      schema:
        type: string

    FunctionNamePath:
      name: functionName
      in: path
      required: true
      schema:
        type: string

    ExecutionIdPath:
      name: executionId
      in: path
      required: true
      schema:
        type: string

    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string

    RoleIdPath:
      name: roleId
      in: path
      required: true
      schema:
        type: string

  schemas:
    # ============ Datasources ============
    DatasourceInfo:
      type: object
      description: 数据源概要信息
      properties:
        id:
          type: string
          description: 数据源唯一标识（等于数据源名称）
        name:
          type: string
          description: 展示名称
        domain:
          type: string
          description: 所属域（如 db）
        type:
          type: string
          description: 数据源类型（如 admin）

    DatasourceColumnInfo:
      type: object
      description: 表列元数据
      properties:
        name:
          type: string
          description: 列名
        columnName:
          type: string
          description: 列名（与 name 同义，兼容前端字段）
        dataType:
          type: string
          description: 数据库类型名
        type:
          type: string
          description: 类型（与 dataType 同义，兼容前端字段）
        comment:
          type: string
          description: 列注释
        description:
          type: string
          description: 列描述（与 comment 同义，兼容前端字段）

    # ============ 通用响应 ============
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
          description: Unix 毫秒时间戳
        status:
          type: integer
        error:
          type: string
        path:
          type: string

    # ============ 枚举类型 ============
    NodeType:
      type: string
      enum:
        - PARAM_VALIDATE
        - DYNAMIC_VALIDATE
        - DATA_QUERY
        - DATA_TRANSFORM
        - ASSEMBLE_RESPONSE
        - SCRIPT
        - CUSTOM
        - CONDITION_BRANCH
        - FILTER
        - PARALLEL
        - SUB_WORKFLOW
        - EIP_ROUTER
        - LOOP
        - WAIT

    FunctionNodeType:
      type: string
      enum:
        - PARAM_VALIDATE
        - DYNAMIC_VALIDATE
        - DATA_QUERY
        - DATA_TRANSFORM
        - ASSEMBLE_RESPONSE
        - SCRIPT
        - CUSTOM
        - CONDITION_BRANCH
        - FILTER
        - PARALLEL
        - SUB_WORKFLOW
        - EIP_ROUTER
        - LOOP
        - WAIT

    ErrorStrategy:
      type: string
      enum: [FAIL, IGNORE, FALLBACK, RETRY]

    WorkflowCategory:
      type: string
      enum: [BUSINESS, META]

    WorkflowScope:
      type: string
      enum: [PLATFORM, PRIVATE, MARKETPLACE]
      description: |
        工作流作用域：
        - PLATFORM: 平台内置，全局共享，仅管理员可修改
        - PRIVATE: 应用私有，绑定到特定 app_group
        - MARKETPLACE: 市场发布，可被安装

    WorkflowStatus:
      type: string
      enum: [DRAFT, ACTIVE, DEPRECATED]

    FunctionCategory:
      type: string
      enum: [BUILTIN, CUSTOM, SCRIPT, EXTERNAL, TRIGGER]

    FunctionStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    NodeTraceStatus:
      type: string
      enum: [SUCCESS, FAILED, SKIPPED, FALLBACK]

    DebugStatus:
      type: string
      enum: [RUNNING, COMPLETED, PAUSED, STEP, FAILED]

    PublishType:
      type: string
      enum: [ALL, APP_GROUP, INSTANCES]
      description: |
        发布目标类型：
        - ALL: 全量广播
        - APP_GROUP: 按应用群发布
        - INSTANCES: 按具体实例发布

    # ============ Workflow 相关 ============
    Position:
      type: object
      properties:
        x:
          type: number
        y:
          type: number

    FilterRule:
      type: object
      required: [field, operator]
      properties:
        field:
          type: string
          description: 字段名（支持点号嵌套路径，如 user.address.city）
        operator:
          type: string
          description: 操作符
          enum: [eq, neq, gt, gte, lt, lte, in, notIn, contains, isNull, isNotNull, startsWith, endsWith, regex]
        value:
          description: 规则值（与字段值比较的目标）
        negate:
          type: boolean
          default: false
          description: 是否对当前规则结果取反

    ConditionalNext:
      type: object
      required: [target]
      properties:
        target:
          type: string
          description: 条件为 true 时跳转的目标节点 ID
        condition:
          type: string
          description: JEXL/SpEL 条件表达式（与 rules 二选一）
        logic:
          type: string
          description: 多字段组合逻辑
          enum: [and, or]
          default: and
        negate:
          type: boolean
          default: false
          description: 是否对整体条件结果取反（表达式模式或规则组合模式均生效）
        rules:
          type: array
          description: 结构化规则列表（与 condition 二选一）
          items:
            $ref: '#/components/schemas/FilterRule'

    WorkflowNode:
      type: object
      required: [id, name, type, functionRef]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: '#/components/schemas/NodeType'
        functionRef:
          type: string
          minLength: 1
          maxLength: 256
        errorStrategy:
          $ref: '#/components/schemas/ErrorStrategy'
        timeoutMs:
          type: integer
          default: 30000
          minimum: 0
        params:
          type: object
          additionalProperties: true
          description: 工作流各节点输入参数（key=nodeId）
        decorators:
          type: array
          items:
            type: string
        decoratorParams:
          type: object
          additionalProperties: true
          description: 工作流各节点输入参数（key=nodeId）
        dependsOn:
          type: array
          items:
            type: string
        position:
          $ref: '#/components/schemas/Position'
        conditionalNexts:
          type: array
          items:
            $ref: '#/components/schemas/ConditionalNext'
        remark:
          type: string
          maxLength: 512
          description: 节点备注（画布显示用）
        asyncExecution:
          type: boolean
          default: false
          description: 是否异步执行（true=不阻塞后续节点，异常不中止流程）

    WorkflowTrigger:
      type: object
      required: [type, functionRef]
      properties:
        id:
          type: string
          maxLength: 128
        type:
          $ref: '#/components/schemas/TriggerType'
        functionRef:
          type: string
          description: |
            TriggerFunctionMeta SPI 的稳定标识符，如 trigger:httpInbound / trigger:kafkaConsumer。
            前端用此值从 /api/admin/trigger-functions 返回值中找对应 meta，拿到 paramSchema 动态渲染表单。
            新增触发器时必填；老数据迁移时按 legacyProtocol 回算。
          example: trigger:httpInbound
        config:
          type: object
          additionalProperties: true
          description: |
            触发器配置，键值完全由对应 TriggerFunctionMeta.paramSchema 决定，前端按 schema 校验：
            - trigger:httpInbound → { "method":"POST","path":"/api/order","authRequired":true }
            - trigger:kafkaConsumer → { "topic":"order.created","consumerGroup":"xxx","concurrency":3 }
        enabled:
          type: boolean
          default: true

    TriggerType:
      type: string
      enum: [MANUAL, WEBHOOK, EVENT, API]
      description: |
        触发器类型（粗粒度分类，仅用于 UI 分组/图标）：
        - MANUAL: 手动执行
        - WEBHOOK: HTTP POST 触发
        - EVENT: 应用事件触发
        - API: API 同步调用
        具体参数结构看 WorkflowTrigger.functionRef + TriggerFunctionMeta.paramSchema。

    TriggerFunctionParam:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          description: 稳定 snake_case 标识符；对应 WorkflowTrigger.config 的 JSON key
        type:
          type: string
          description: |
            UI 渲染提示类型：string / number / integer / boolean / enum / duration_ms。
            未知类型前端 fall back 到自由文本输入。
        required:
          type: boolean
          default: false
        label:
          type: string
          description: 表单 label，默认 = name
        description:
          type: string
          description: Tooltip 提示
        defaultValue:
          description: 新增触发器时预填的值，类型按 type 决定（可能是 string/number/boolean/null）
        options:
          type: array
          description: "当 type=enum 时必填。每对 [value, label]，value 存到 config，label 显示给用户。"
          items:
            type: array
            items: {}
            minItems: 2
            maxItems: 2

    TriggerFunctionMeta:
      type: object
      required: [functionRef, label, paramSchema]
      properties:
        functionRef:
          type: string
          description: 稳定标识符，如 trigger:httpInbound，对应 WorkflowTrigger.functionRef
        label:
          type: string
          description: 触发函数下拉显示名，如 HTTP / HTTPS 接口
        icon:
          type: string
          description: AntD 图标名，默认 ApiOutlined
        description:
          type: string
          description: 表单顶部 help banner 文本
        paramSchema:
          type: array
          items:
            $ref: '#/components/schemas/TriggerFunctionParam'
        legacyProtocol:
          type: string
          description: |
            映射到 legacy wf_definition.protocol 的大写标签（HTTP/KAFKA/DUBBO/GRPC）。
            纯函数集合或非入站型 trigger（如 cron）为 null。用于过渡期双向同步旧列。
          nullable: true

    WorkflowDefinition:
      type: object
      required: [name, category, nodes]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: 主键（发布函数集合、调试、版本管理等需要 Long ID）
        workflowId:
          type: string
          readOnly: true
          description: 业务工作流 ID（对外暴露，可用于路由绑定）
        name:
          type: string
          minLength: 1
          maxLength: 128
        category:
          $ref: '#/components/schemas/WorkflowCategory'
        scope:
          $ref: '#/components/schemas/WorkflowScope'
        appGroup:
          type: string
          maxLength: 128
          description: 所属应用分组（scope=PRIVATE 时必填）
        sourceRef:
          type: string
          readOnly: true
          description: 来源引用（安装市场工作流时指向原始 workflowId）
        protocol:
          type: string
          nullable: true
          minLength: 1
          maxLength: 32
          description: |
            触发协议（HTTP/HTTPS/KAFKA/DUBBO/GRPC 等）。
            为空表示"无触发入口的纯函数集合"——不能直接被外部事件/请求触发，仅能被其它工作流通过 SET_REF 引用/复用。
        method:
          type: string
          maxLength: 20
          description: |
            协议方法。HTTP/HTTPS：标准 HTTP 方法（GET/POST/PUT/DELETE 等）；
            gRPC：调用类型（UNARY/SERVER_STREAMING 等）；Dubbo：接口方法名（可选）。
        path:
          type: string
          maxLength: 512
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        isPublishedSet:
          type: boolean
          readOnly: true
          description: 是否已发布为可复用函数集合（wf_function 中有对应 SET_REF 记录）
        setRefName:
          type: string
          nullable: true
          readOnly: true
          description: 已发布集合在函数表的 function_alias（SET_REF 解析用），未发布时为 null
        inputSchema:
          type: object
          additionalProperties: true
          description: 入参 Schema 内容（具体语法由 inputSchemaFormat 决定）
        inputSchemaFormat:
          type: string
          default: json-schema
          description: 入参 Schema 格式标识（如 json-schema、protobuf、avro，支持扩展自定义格式）
        inputSchemaRef:
          type: string
          nullable: true
          maxLength: 128
          description: |
            共享入参 Schema 引用名称（对应 wf_schema.schema_name）。
            当此字段非空时，前端「Schema 下拉」显示当前选中的引用名；运行时由 SchemaManager 按 ref 解析，优先级高于内嵌的 inputSchema。
        outputSchema:
          type: object
          additionalProperties: true
          description: 出参 Schema 内容（具体语法由 outputSchemaFormat 决定）
        outputSchemaFormat:
          type: string
          default: json-schema
          description: 出参 Schema 格式标识（如 json-schema、protobuf、avro，支持扩展自定义格式）
        outputSchemaRef:
          type: string
          nullable: true
          maxLength: 128
          description: |
            共享出参 Schema 引用名称（对应 wf_schema.schema_name）。
            当此字段非空时，运行时由 SchemaManager 按 ref 解析，优先级高于内嵌的 outputSchema。
        transactionConfig:
          type: object
          additionalProperties: true
          description: |
            事务配置（TransactionConfig 序列化）。
            字段示例：{ "propagationBehavior": 0, "isolationLevel": 2, "timeoutMs": 30000, "transactionName": "create-order" }
            特殊值 { "mode": "SAGA" } 表示使用 Saga 模式。
        workflowDecorators:
          type: array
          items:
            type: string
          description: 工作流级装饰器列表（按顺序包裹整段工作流执行）
        workflowDecoratorParams:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
          description: 工作流级装饰器参数（key=装饰器名，value=参数Map）
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNode'
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTrigger'
          description: 触发器列表（定义工作流的启动方式）
        publishTarget:
          $ref: '#/components/schemas/PublishTarget'
        version:
          type: integer
          readOnly: true
        createdAt:
          type: integer
          format: int64
          readOnly: true
          description: Unix 毫秒时间戳
        updatedAt:
          type: integer
          format: int64
          readOnly: true
          description: Unix 毫秒时间戳
        isProtected:
          type: boolean
          readOnly: true

    NodeTrace:
      type: object
      properties:
        nodeId:
          type: string
        nodeName:
          type: string
        status:
          $ref: '#/components/schemas/NodeTraceStatus'
        durationMs:
          type: integer
        inputs:
          type: object
          additionalProperties: true
