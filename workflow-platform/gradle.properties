# ============ Build Performance ============
# Parallel compilation: independent modules compile concurrently
# (dependent modules still follow topological order)
org.gradle.parallel=true
# Max parallel workers (defaults to CPU cores)
org.gradle.workers.max=8
# Build cache: reuse compilation outputs across builds
org.gradle.caching=true

# Kotlin 2.x + Gradle 8.12 兼容性：打破 compileJava ↔ compileKotlin 循环依赖
kotlin.build.archivesTaskOutputAsFriendModule=false

org.gradle.max.parallel.downloads=10
org.gradle.network.timeout=120000
org.gradle.daemon=true


org.gradle.jvmargs=-Dfile.encoding=UTF-8
system.prop.file.encoding=UTF-8