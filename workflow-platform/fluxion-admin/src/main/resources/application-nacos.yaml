# Nacos 配置中心 + 注册中心 Profile
# 激活方式：spring.profiles.active=local,nacos（或 nacos 单独激活）
#
# 切换回 HTTP 自举模式：移除 nacos profile 即可（默认 type=http）
spring:
  config:
    activate:
      on-profile: nacos

workflow:
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:}
      # username: ${NACOS_USERNAME:nacos}
      # password: ${NACOS_PASSWORD:nacos}
