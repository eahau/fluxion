# DevTools restart trigger configuration
# -----------------------------------------------
# exclude: jars that should NOT trigger restart
# (large third-party libs to avoid unnecessary restarts)
# -----------------------------------------------
# Multi-module note: fluxion-* submodules are auto-included
# via Gradle project dependencies, no explicit include needed.
# -----------------------------------------------

restart.exclude.kotlin-stdlib=.*/kotlin-stdlib.*\.jar
restart.exclude.kotlin-reflect=.*/kotlin-reflect.*\.jar
restart.exclude.jackson=.*/jackson-.*\.jar
restart.exclude.spring-boot=.*/spring-boot-3.*\.jar
restart.exclude.spring-core=.*/spring-core-.*\.jar
restart.exclude.spring-context=.*/spring-context-.*\.jar
restart.exclude.spring-web=.*/spring-web-.*\.jar
restart.exclude.spring-webmvc=.*/spring-webmvc-.*\.jar
restart.exclude.hibernate=.*/hibernate-core-.*\.jar
