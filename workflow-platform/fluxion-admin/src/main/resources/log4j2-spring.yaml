# Log4j2 配置（YAML 格式）
# 文件名使用 -spring 后缀以支持 Spring Boot profile 机制
# monitorInterval: 每 30 秒检测文件变化，自动热重载
Configuration:
  status: WARN
  monitorInterval: 30

  properties:
    property:
      # 控制台格式：时间 [线程] 级别 [traceId] 包名首字母.完整类名 - 消息
      - name: CONSOLE_PATTERN
        value: "%d{HH:mm:ss.SSS} [%t] %-5level [%X{traceId}] %logger{1.} - %msg%n"
      # 日志文件输出格式：加上日期，便于离线排查
      - name: FILE_PATTERN
        value: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level [%X{traceId}] %logger{36} - %msg%n"
      # 日志根目录：优先环境变量 LOG_DIR，其次写到当前用户 home 下的 .fluxion/<app>/logs
      - name: LOG_PATH
        value: "${env:LOG_DIR:-${sys:user.home}/.fluxion/fluxion-admin/logs}"
      # 单文件大小阈值，超过触发轮转
      - name: MAX_FILE_SIZE
        value: "100 MB"
      # 历史文件保留天数
      - name: FILE_MAX_HISTORY_DAYS
        value: "30"
      # 历史归档总大小上限（超过则自动删除最旧）
      - name: TOTAL_SIZE_CAP
        value: "10 GB"

  Appenders:
    Console:
      name: Console
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "${CONSOLE_PATTERN}"

    # ========== 主日志（全局 + com.fluxion 代码） ==========
    RollingFile:
      - name: MainFile
        fileName: "${LOG_PATH}/fluxion-admin.log"
        filePattern: "${LOG_PATH}/archive/fluxion-admin.%d{yyyy-MM-dd}.%i.log.gz"
        PatternLayout:
          pattern: "${FILE_PATTERN}"
        Policies:
          TimeBasedTriggeringPolicy:
            interval: 1
            modulate: true
          SizeBasedTriggeringPolicy:
            size: "${MAX_FILE_SIZE}"
        DefaultRolloverStrategy:
          max: "${FILE_MAX_HISTORY_DAYS}"
          Delete:
            basePath: "${LOG_PATH}/archive"
            maxDepth: 1
            IfAccumulatedFileSize:
              exceeds: "${TOTAL_SIZE_CAP}"

      # ========== 工作流执行明细日志（单独文件，便于 tail -f 调试单个流程） ==========
      - name: WorkflowExecutionFile
        fileName: "${LOG_PATH}/workflow-execution.log"
        filePattern: "${LOG_PATH}/archive/workflow-execution.%d{yyyy-MM-dd}.%i.log.gz"
        PatternLayout:
          pattern: "${FILE_PATTERN}"
        Policies:
          TimeBasedTriggeringPolicy:
            interval: 1
            modulate: true
          SizeBasedTriggeringPolicy:
            size: "${MAX_FILE_SIZE}"
        DefaultRolloverStrategy:
          max: "${FILE_MAX_HISTORY_DAYS}"

      # ========== WorkflowEngine + 节点执行快照（DEBUG 时单独落盘） ==========
      - name: EngineFile
        fileName: "${LOG_PATH}/fluxion-engine.log"
        filePattern: "${LOG_PATH}/archive/fluxion-engine.%d{yyyy-MM-dd}.%i.log.gz"
        PatternLayout:
          pattern: "${FILE_PATTERN}"
        Policies:
          TimeBasedTriggeringPolicy:
            interval: 1
            modulate: true
          SizeBasedTriggeringPolicy:
            size: "${MAX_FILE_SIZE}"
        DefaultRolloverStrategy:
          max: "${FILE_MAX_HISTORY_DAYS}"

  Loggers:
    # 项目业务代码：Console + MainFile 双输出
    Logger:
      - name: com.fluxion
        level: INFO
        additivity: false
        AppenderRef:
          - ref: Console
          - ref: MainFile

      # WorkflowEngine：Debug 级别，另外单独落 EngineFile
      - name: com.fluxion.core.engine
        level: DEBUG
        additivity: false
        AppenderRef:
          - ref: Console
          - ref: EngineFile

      # 工作流执行日志（专用命名 Logger）：Console + 单独文件
      - name: WorkflowExecutionLog
        level: INFO
        additivity: false
        AppenderRef:
          - ref: Console
          - ref: WorkflowExecutionFile

      # 减少 Spring/Hibernate 框架噪音（本地调试临时设为 INFO 看启动细节）
      - name: org.springframework
        level: INFO
      - name: org.hibernate
        level: WARN
      - name: org.apache
        level: WARN
      - name: com.zaxxer.hikari
        level: INFO

    Root:
      level: INFO
      AppenderRef:
        - ref: Console
        - ref: MainFile
