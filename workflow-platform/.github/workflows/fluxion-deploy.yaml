# ============================================================
# Fluxion CI/CD — GitHub Actions → Docker Registry → GitOps
# ============================================================
#
# 触发条件：
#   - push 到 main 分支
#   - 手动触发 (workflow_dispatch)
#
# 流水线：
#   1. 构建 Native Image Docker 镜像
#   2. 推送到容器仓库（GHCR / DockerHub / 私有仓库）
#   3. 更新 GitOps 仓库中的镜像 tag（触发 ArgoCD 自动同步）
#

name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'workflow-platform/**'
      - 'doc/**'
      - '.github/workflows/fluxion-deploy.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 tag（默认使用 git sha）'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/fluxion-admin
  WORKDIR: workflow-platform

jobs:

  # ── 构建 & 推送 Native Image 镜像 ──────────────────────────
  build-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag || github.sha }}"
          echo "tag=${TAG:0:7}" >> $GITHUB_OUTPUT
          echo "full_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG:0:7}" >> $GITHUB_OUTPUT

      - name: Build & Push Native Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKDIR }}
          file: ${{ env.WORKDIR }}/deploy/Dockerfile
          target: native
          push: true
          tags: |
            ${{ steps.meta.outputs.full_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ── 构建 & 推送 JVM 镜像（可选，并行） ─────────────────────
  build-jvm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag || github.sha }}"
          echo "tag=${TAG:0:7}" >> $GITHUB_OUTPUT
          echo "full_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-jvm:${TAG:0:7}" >> $GITHUB_OUTPUT

      - name: Build & Push JVM Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKDIR }}
          file: ${{ env.WORKDIR }}/deploy/Dockerfile
          target: jvm
          push: true
          tags: |
            ${{ steps.meta.outputs.full_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-jvm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ── GitOps: 更新 K8s manifests 中的镜像 tag ────────────────
  deploy:
    needs: [build-native]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}  # 同仓库 GitOps，也可用独立仓库
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in K8s manifest
        run: |
          TAG="${{ github.event.inputs.image_tag || github.sha }}"
          SHORT_TAG="${TAG:0:7}"
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_TAG}"

          # 替换 deployment.yaml 中的镜像地址
          sed -i "s|image: fluxion-admin:.*|image: ${FULL_IMAGE}|g" \
            ${{ env.WORKDIR }}/deploy/k8s/deployment.yaml

          echo "Updated image to: ${FULL_IMAGE}"
          cat ${{ env.WORKDIR }}/deploy/k8s/deployment.yaml | grep "image:"

      - name: Commit & Push (触发 ArgoCD 同步)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.WORKDIR }}/deploy/k8s/deployment.yaml
          git diff --staged --quiet || git commit -m "chore: update fluxion-admin image to ${{ github.sha }}"
          git push
